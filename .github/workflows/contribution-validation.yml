name: Contribution validation
on:
  push:
    branches:
      - validation/log-tail-review-20261114
permissions:
  contents: read
jobs:
  make-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: '3.11'
      SAM_CLI_TELEMETRY: '0'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: '3.11'
          cache-python: false
      - run: bash tests/setup-python-uv.sh 3.11
      - run: make pr
